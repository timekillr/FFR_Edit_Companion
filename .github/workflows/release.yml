name: Build and test FFR Edit Companion
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Expand and commit initial source bundle
        if: ${{ hashFiles('source-bootstrap.zip') != '' || hashFiles('source-bootstrap.b64') != '' }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile, base64, io
          bundle = Path('source-bootstrap.b64')
          archive_bytes = base64.b64decode(bundle.read_bytes(), validate=False) if bundle.exists() else Path('source-bootstrap.zip').read_bytes()
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Invalid archive path')
                  if item.is_dir() or item.filename.startswith('.github/workflows/'):
                      continue
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.read(item))
                  path.chmod((item.external_attr >> 16) & 0o777 or 0o644)
          PYCODE
          git rm --ignore-unmatch source-bootstrap.zip source-bootstrap.b64
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import tested FFR Edit 0.2.0 source'
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test pinned transport and build installable development APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Package APK and web companion
        run: |
          mkdir artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/FFR_Edit_Companion-unsigned.apk
          python3 -m zipfile -c artifacts/FFR_Edit_Web.zip web
          cd artifacts
          sha256sum *.apk *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: FFR_Edit_Companion
          path: artifacts/*
      - name: Verify the maintainer-signed APK
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib
          from pathlib import Path
          raw = base64.b64decode(Path('release/signed-apk.b64').read_bytes())
          expected = Path('release/signed-apk.sha256').read_text().strip()
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('Signed APK checksum mismatch')
          Path('artifacts/FFR_Edit_Companion.apk').write_bytes(raw)
          PYCODE
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/FFR_Edit_Companion.apk
          rm artifacts/FFR_Edit_Companion-unsigned.apk
          cd artifacts
          sha256sum FFR_Edit_Companion.apk FFR_Edit_Web.zip > SHA256SUMS
      - name: Publish verified signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.2.0 artifacts/FFR_Edit_Companion.apk artifacts/FFR_Edit_Web.zip artifacts/SHA256SUMS --target "$(git rev-parse HEAD)" --title "FFR Edit Companion 0.2.0" --notes "Updated backup verification receipts and safe connection lifecycle. The signed APK is SHA-256 checked and its APK signature verified. Version 0.2.0 introduces a stable release signing key; uninstall the old CI debug-signed 0.1.0 app once before installing and pairing again. Requires FFR Edit 0.2.0 for archive verification."
